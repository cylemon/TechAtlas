[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]


# pytest 配置统一放在 pytest.ini（pytest.ini 优先级高于 pyproject.toml，
# 两处同时存在时此处会被忽略，故不再重复声明）

# 核心修改：告诉 uv 这是一个应用程序/服务，不需要构建和打包 installable wheel
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
